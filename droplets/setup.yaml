#cloud-config
package_update: true
package_upgrade: false      # faster, flip to true if you need it
packages:
  - git
  - python3
  - python3-pip
  - python3-venv
  - pkg-config
  - libssl-dev
  - build-essential
  - curl

write_files:
  - path: /root/setup-script.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euxo pipefail

      # Log everything to a file
      exec > >(tee -a /root/setup.log) 2>&1
      echo "=== Setup script started at $(date) ==="

      export DEBIAN_FRONTEND=noninteractive

      # ---- Fix A: define HOME and cargo paths up front ----
      #export HOME=/root
      #export CARGO_HOME=/root/.cargo
      #export RUSTUP_HOME=/root/.rustup
      #export PATH="/root/.cargo/bin:$PATH"
      # -----------------------------------------------------

      # Ensure tools present (already installed via packages, but safe if image differs)
      apt-get update -y
      apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev curl git

      # Verify gcc
      command -v gcc >/dev/null

      # Install rustup non-interactively
      curl -fsSL https://sh.rustup.rs | sh -s -- -y

      # Update PATH to include cargo/rustup (must be done after installation)
      export PATH="/root/.cargo/bin:$PATH"

      # Verify cargo is available
      command -v cargo >/dev/null || { echo "ERROR: cargo not found after rustup install"; exit 1; }

      # Nightly toolchain
      rustup toolchain install nightly
      rustup default nightly

      # Clone and build alto
      cd /root
      rm -rf /root/alto || true
      git clone https://github.com/scaffino/alto.git
      cd /root/alto
      git fetch --all

      # Checkout main branch
      git checkout main

      # Build
      cargo build --release --bin validator

      # Make cargo available in non-interactive shells by adding to .bashrc
      # This ensures PATH is set when SSH runs commands
      if ! grep -q '/root/.cargo/bin' /root/.bashrc 2>/dev/null; then
        echo 'export PATH="/root/.cargo/bin:$PATH"' >> /root/.bashrc
      fi
      # Also add to .profile for login shells
      if ! grep -q '/root/.cargo/bin' /root/.profile 2>/dev/null; then
        echo 'export PATH="/root/.cargo/bin:$PATH"' >> /root/.profile
      fi

      echo "=== Setup complete at $(date) ==="

runcmd:
  - /root/setup-script.sh
